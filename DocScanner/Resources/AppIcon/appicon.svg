<?xml version="1.0" encoding="UTF-8"?>
<!-- App icon background: purple gradient (the foreground scanner mark sits on top). -->
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A7FF0"/>
      <stop offset="1" stop-color="#3A2F99"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="456" height="456" fill="url(#bg)"/>
</svg>
